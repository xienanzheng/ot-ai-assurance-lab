[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "ot-assurance-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.11.7", "fastapi==0.116.1", "httpx==0.28.1", "uvicorn==0.35.0", "asyncua==1.1.6", "sqlalchemy==2.0.41", "psycopg[binary]==3.2.9"]
[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.1.0"]
[tool.setuptools.packages.find]
include = ["v2*", "training*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
